<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact STRIDE</title>
  <meta name="description" content="Contact STRIDE shoe store via phone, email, or visit our location." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar"><div class="container nav-wrap"><a class="logo" href="index.html">STRIDE</a><button class="menu-toggle">☰</button><nav class="main-nav"><a href="index.html">Home</a><a href="products.html">Shop</a><a href="cart.html">Cart <span id="cartCount">0</span></a><a href="contact.html">Contact</a></nav></div></header>
  <main class="section">
    <div class="container contact-layout">
      <section>
        <h1>Contact Us</h1>
        <p><strong>Phone:</strong> +1 (555) 123-4567</p>
        <p><strong>Email:</strong> hello@strideshoes.com</p>
        <p><strong>Address:</strong> 123 Market Street, New York, NY 10001</p>
        <iframe title="Store Location" src="https://www.google.com/maps?q=Times+Square,+New+York&output=embed" loading="lazy"></iframe>
      </section>
      <form class="contact-form">
        <input type="text" placeholder="Your Name" required />
        <input type="email" placeholder="Your Email" required />
        <textarea placeholder="Your Message" rows="6" required></textarea>
        <button class="btn btn-primary" type="submit">Send Message</button>
      </form>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
